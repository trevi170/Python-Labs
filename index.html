<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Labs — Learn & Practice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f4;
      --text: #1a1a1a;
      --text-secondary: #5c5c5c;
      --border: rgba(0,0,0,0.12);
      --primary: #667eea;
      --primary-dark: #5568d3;
      --radius: 12px;
      --font-sans: system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1c;
        --bg-secondary: #272727;
        --text: #f0f0f0;
        --text-secondary: #aaa;
        --border: rgba(255,255,255,0.1);
      }
    }
    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, var(--primary) 0%, #764ba2 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 50px;
      animation: fadeIn 0.6s ease-in;
    }
    .header h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .header p {
      font-size: 18px;
      opacity: 0.95;
      max-width: 600px;
      margin: 0 auto;
    }
    .labs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .lab-card {
      background: var(--bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .lab-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      border-color: var(--primary);
    }
    .lab-badge {
      display: inline-block;
      background: #E6F1FB;
      color: #0C447C;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      width: fit-content;
    }
    .lab-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .lab-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .lab-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lab-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      flex: 1;
      text-align: center;
      min-width: 120px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--border);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--text-secondary);
    }
    .empty-state p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    .footer {
      text-align: center;
      color: white;
      opacity: 0.8;
      margin-top: 50px;
      font-size: 14px;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .lab-card {
      animation: fadeIn 0.6s ease-in;
    }
    .lab-card:nth-child(2) { animation-delay: 0.1s; }
    .lab-card:nth-child(3) { animation-delay: 0.2s; }
    .lab-card:nth-child(4) { animation-delay: 0.3s; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🐍 Python Labs</h1>
    <p>Self-grading labs to master Python fundamentals. Complete assignments, get instant feedback, and download certificates.</p>
  </div>

  <div class="labs-grid" id="labsGrid">
    <!-- Labs will be inserted here -->
  </div>

  <div class="footer">
    <p>📚 Created for Python learners • Self-grading with automated testing</p>
  </div>
</div>

<script>
  const labs = [
    {
      id: 'lab-2-6-1-9',
      title: 'Lab 2.6.1.9: Simple Input and Output',
      description: 'Master Python\'s input/output operations and basic arithmetic calculations. Write simple code to perform calculations and display results.',
      difficulty: 'Beginner',
      duration: '5-10 mins',
      skills: ['Variables', 'Arithmetic', 'Output'],
      links: [
        { label: 'Start Lab', href: 'lab-2-6-1-9.html', primary: true },
        { label: 'View on GitHub', href: 'https://github.com/trevi170/python-lab-simple-io', primary: false }
      ]
    },
    // Add more labs here following the same format
    // Example:
    // {
    //   id: 'lab-name',
    //   title: 'Lab Title',
    //   description: 'Description of what students will learn',
    //   difficulty: 'Beginner|Intermediate|Advanced',
    //   duration: 'X-Y mins',
    //   skills: ['Skill1', 'Skill2', 'Skill3'],
    //   links: [
    //     { label: 'Start Lab', href: 'lab-name.html', primary: true },
    //     { label: 'View on GitHub', href: 'https://github.com/...', primary: false }
    //   ]
    // }
  ];

  function renderLabs() {
    const grid = document.getElementById('labsGrid');

    if (labs.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <p>📝 No labs available yet</p>
          <p style="font-size: 13px; color: var(--text-tertiary);">Check back soon for new labs!</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = labs.map(lab => `
      <div class="lab-card">
        <div class="lab-badge">${lab.difficulty}</div>
        <h2 class="lab-title">${lab.title}</h2>
        <p class="lab-desc">${lab.description}</p>
        <div class="lab-meta">
          <div class="meta-item">⏱️ ${lab.duration}</div>
          <div class="meta-item">🎯 ${lab.skills.join(', ')}</div>
        </div>
        <div class="lab-links">
          ${lab.links.map(link => `
            <a href="${link.href}" class="btn ${link.primary ? 'btn-primary' : 'btn-secondary'}" target="${link.href.startsWith('http') ? '_blank' : '_self'}">
              ${link.label}
            </a>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  renderLabs();
</script>
</body>
</html>
